<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My account | Ishavarya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Jaldi:wght@400;700&family=Literata:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body class="about-page">
    <header class="about-bar">
        <a class="about-bar__back" href="index.html" aria-label="Back to home">
            <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.500a5.500 5.500 0 0 1 0 11H11"/></svg>
        </a>
        <a class="about-bar__brand" href="index.html">ई&nbsp;&nbsp; श्&nbsp;&nbsp; व&nbsp;&nbsp; र्य</a>
        <a class="about-bar__link" href="cart.html" aria-label="Shopping bag">
            <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
            <span class="cart-count" data-cart-count hidden>0</span>
        </a>
    </header>

    <main class="page">
        <h1 class="page__title">My Account</h1>

        <div class="account">
            <!-- Menu -->
            <aside class="account__menu" aria-label="Account menu">
                <div class="account__who">
                    <span class="account__avatar" id="avatar" aria-hidden="true">?</span>
                    <div>
                        <p class="account__name" id="who-name">Guest</p>
                        <p class="account__sub" id="who-sub">Add your details</p>
                    </div>
                </div>

                <nav>
                    <a href="#profile" data-panel="profile">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.400 3.600-7 8-7s8 2.600 8 7"/></svg> My profile
                    </a>
                    <a href="#orders" data-panel="orders">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4-9-4Z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>                        My orders
                    </a>
                    <a href="cart.html">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg> Shopping
                        bag
                        <span class="account__pill" data-cart-count hidden>0</span>
                    </a>
                    <a href="#wishlist" data-panel="wishlist">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 20.500s-7.500-4.600-7.500-10A4.500 4.500 0 0 1 12 7.600a4.500 4.500 0 0 1 7.500 2.900c0 5.400-7.500 10-7.500 10Z"/></svg>                        Wishlist
                    </a>
                    <button type="button" id="logout">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4"/><path d="M16 8l4 4-4 4"/><path d="M20 12H9"/></svg>
            Logout
          </button>
                </nav>
            </aside>

            <!-- Panels -->
            <div class="account__panels">
                <section class="panel" id="profile" aria-labelledby="profile-title">
                    <h2 id="profile-title">My profile</h2>
                    <form id="profile-form" class="form" novalidate>
                        <div class="form__grid">
                            <label class="field field--wide">
                <span>Full name</span>
                <input type="text" name="name" autocomplete="name" placeholder="Your full name" required />
              </label>
                            <label class="field">
                <span>Mobile number</span>
                <input type="tel" name="phone" autocomplete="tel" inputmode="tel" placeholder="10-digit mobile number" />
              </label>
                            <label class="field">
                <span>Email</span>
                <input type="email" name="email" autocomplete="email" placeholder="you@example.com" />
              </label>
                            <label class="field field--wide">
                <span>Address</span>
                <textarea name="address" rows="3" autocomplete="street-address" placeholder="House / flat no., building, street, area"></textarea>
              </label>
                            <label class="field">
                <span>City</span>
                <input type="text" name="city" autocomplete="address-level2" placeholder="City" />
              </label>
                            <label class="field">
                <span>PIN code</span>
                <input type="text" name="pin" autocomplete="postal-code" inputmode="numeric" maxlength="6" placeholder="6-digit PIN" />
              </label>
                        </div>
                        <div class="form__actions">
                            <button type="submit" class="btn">Save details</button>
                            <p class="form__status" id="profile-status" role="status"></p>
                        </div>
                    </form>
                </section>

                <section class="panel" id="orders" aria-labelledby="orders-title" hidden>
                    <h2 id="orders-title">My orders</h2>
                    <div id="orders-list"></div>
                </section>

                <section class="panel" id="wishlist" aria-labelledby="wishlist-title" hidden>
                    <h2 id="wishlist-title">Wishlist</h2>
                    <div id="wishlist-list"></div>
                </section>
            </div>
        </div>
    </main>

    <script src="site.js"></script>
    <script src="account.js"></script>
</body>

</html>
